# Like openmediavault's generated configuration (deb/openmediavault salt templates).
[global]
workgroup = WORKGROUP
server string = %h server
dns proxy = no
log level = 1
logging = file
passdb backend = tdbsam
obey pam restrictions = no
socket options = TCP_NODELAY IPTOS_LOWDELAY
guest account = nobody
load printers = no
disable spoolss = yes
printing = bsd
printcap name = /dev/null
unix extensions = yes
create mask = 0777
directory mask = 0777
use sendfile = yes
aio read size = 1
aio write size = 1
time server = no
wins support = no
disable netbios = yes
multicast dns register = no
server min protocol = SMB2_02
fruit:aapl = yes
fruit:copyfile = yes
fruit:nfs_aces = no
[Videos]
path = /srv/dev-disk-by-uuid-1234/Videos/
guest ok = no
guest only = no
read only = no
browseable = yes
inherit acls = yes
inherit permissions = no
ea support = no
store dos attributes = no
vfs objects =
printable = no
create mask = 0664
force create mode = 0664
directory mask = 0775
force directory mode = 0775
hide special files = yes
follow symlinks = yes
hide dot files = yes
valid users = tester
