# Like openmediavault's generated configuration (deb/openmediavault-ftp salt templates).
Include /etc/proftpd/modules.conf
LoadModule mod_vroot.c
UseIPv6 off
ServerName omv
ServerType standalone
DeferWelcome on
DefaultServer on
DisplayChdir .message true
MaxInstances 30
DenyFilter \*.*/
User proftpd
Group nogroup
PersistentPasswd off
TimesGMT off
AuthOrder mod_auth_unix.c
Port 21
TransferLog NONE
UseReverseDNS off
TimeoutIdle 1200
PassivePorts 30000 30009
<Directory />
  HideFiles (welcome.msg)
</Directory>
<Directory /Videos>
  Umask 000 000
  <Limit ALL>
    AllowUser OR tester
    DenyAll
  </Limit>
  <Limit READ DIRS>
    AllowUser OR tester
    DenyAll
  </Limit>
</Directory>
<IfModule mod_auth.c>
  DefaultRoot /srv/ftp
  MaxClients 5
  RequireValidShell off
  UseFtpUsers off
</IfModule>
<IfModule mod_vroot.c>
  VRootEngine on
  VRootLog /var/log/proftpd/vroot.log
  VRootAlias "/srv/dev-disk-by-uuid-1234/Videos/" "/Videos"
</IfModule>
<IfModule mod_xfer.c>
  AllowOverwrite on
  AllowRetrieveRestart on
  AllowStoreRestart on
  DefaultTransferMode ascii
  DeleteAbortedStores off
  TimeoutNoTransfer 600
  TimeoutStalled 600
</IfModule>
