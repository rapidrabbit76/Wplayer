[package]
name = "wplayer-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]
name = "wplayer_core"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
futures-util = "0.3.34"
httpdate = "1.0.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
jni-sys = "0.4.1"
libc = "0.2.191"
libloading = "0.9.0"
log = "0.4.34"
nfs3_client = { version = "0.9", features = ["tokio"] }
percent-encoding = "2.3.2"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smb = "0.12"
suppaftp = { version = "12", features = ["rustls-ring"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
uniffi = { version = "0.32", features = ["tokio"] }
webpki-roots = "1.0.9"
whisper-rs = "0.16"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
# rquickjs ships no bindings for Android targets; generate them as whisper-rs-sys does.
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"] }

[dev-dependencies]
tempfile = "3"
